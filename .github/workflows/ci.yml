name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  classify-ci-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}

    steps:
      - id: classify
        name: Classify workflow trust
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || github.actor }}
          HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          trusted="false"
          case "$ACTOR" in
            Corvus400|renovate\[bot\])
              if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
                trusted="true"
              fi
              ;;
          esac

          echo "event=$EVENT"
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
          echo "trusted=$trusted"

  verify:
    needs: [classify-ci-trust]
    if: needs.classify-ci-trust.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm eslint:hooks
      - run: pnpm typecheck
      - run: pnpm test

  ci-gate:
    needs: [classify-ci-trust, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required CI jobs
        env:
          CLASSIFY_RESULT: ${{ needs.classify-ci-trust.result }}
          TRUSTED: ${{ needs.classify-ci-trust.outputs.trusted }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::classify-ci-trust result is $CLASSIFY_RESULT"
            exit 1
          fi
          if [ "$TRUSTED" != "true" ]; then
            echo "::error::External pull requests are not accepted for this portfolio repository."
            exit 1
          fi
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error::verify result is $VERIFY_RESULT"
            exit 1
          fi
          echo "All required CI jobs passed."
